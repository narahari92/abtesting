# Local PostgreSQL for development and integration tests.
#   docker compose up -d
#   export DATABASE_URL=postgres://variants:variants@localhost:5432/variants?sslmode=disable
#   export TEST_DATABASE_URL=$DATABASE_URL
# Without Docker, scripts/localdb.sh does the same with a Homebrew Postgres.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: variants
      POSTGRES_PASSWORD: variants
      POSTGRES_DB: variants
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U variants"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  pgdata:

name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: variants
          POSTGRES_PASSWORD: variants
          POSTGRES_DB: variants
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U variants"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://variants:variants@localhost:5432/variants?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Lint
        run: make lint
      - name: Go tests
        run: go test ./...
      - name: JS tests
        run: make test-js
